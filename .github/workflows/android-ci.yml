name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant wrapper permission
        run: chmod +x gradlew

      - name: Install and verify secure backend
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev
          npm run build
          npm run test:rules

      - name: Test, lint, and build Android artifacts
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest :benchmark:assembleBenchmarkRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: newsynk-debug-${{ github.sha }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: newsynk-unit-test-report-${{ github.sha }}
          path: build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
